{% extends "base.html" %}

{% block title %}Catálogo - Velocity Motors{% endblock %}

{% block content %}
    <h2 style="color: #fff; margin-bottom: 5px; text-transform: uppercase;">🏎️ Nosso Showroom</h2>
    <p style="color: #64748b; margin-bottom: 25px;">Explore toda a nossa frota de veículos disponíveis.</p>

    <div class="grid-carros">
        {% for c in carros %}
            <div class="card">
                <img src="{{ c.imagem }}" alt="{{ c.modelo }}">
                <div class="card-body">
                    <span class="card-brand">{{ c.marca }}</span>
                    <h4 class="card-title">{{ c.modelo }}</h4>
                    <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 15px;">ID: #{{ c.id }}</p>
                    <a href="/carro/{{ c.id }}" class="btn btn-block">Ver Detalhes</a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
