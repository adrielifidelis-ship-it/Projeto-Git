<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Velocity Motors - Alta Performance{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Fundo do site em Azul Escuro e texto em Branco */
        body { background-color: #0d1b2a; color: #ffffff; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Cabeçalho / Navbar */
        header { background: #070e17; border-bottom: 3px solid #2563eb; padding: 12px 40px; box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2); }
        nav { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        
        /* Logo e Título */
        .logo { display: flex; align-items: center; gap: 15px; text-decoration: none; color: #ffffff; font-size: 1.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .logo img { height: 65px; border-radius: 6px; transition: transform 0.3s ease; }
        .logo:hover img { transform: scale(1.05); }
        .logo span { color: #60a5fa; }

        /* Links de Navegação */
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #e2e8f0; text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: all 0.3s; padding: 8px 14px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .nav-links a:hover { color: #ffffff; background-color: #2563eb; }

        /* Conteúdo Principal */
        main { max-width: 1100px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }

        /* Grid de Cards */
        .grid-carros { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; margin-top: 25px; }
        .card { background: #1b263b; border: 1px solid #415a77; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 15px rgba(0,0,0,0.4); transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-7px); border-color: #60a5fa; box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-bottom: 2px solid #415a77; }
        .card-body { padding: 20px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 1.3rem; color: #ffffff; margin-bottom: 5px; font-weight: 700; }
        .card-brand { font-size: 0.85rem; color: #60a5fa; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }
        
        /* Botões Estilizados */
        .btn { display: inline-block; padding: 12px 20px; background-color: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; transition: all 0.3s; }
        .btn:hover { background-color: #1d4ed8; box-shadow: 0 0 15px rgba(37, 99, 235, 0.5); }
        .btn-block { width: 100%; margin-top: auto; }

        /* Formulários / Filtro */
        .filter-section { background: #1b263b; border-left: 4px solid #2563eb; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 30px; }
        select { padding: 10px 15px; font-size: 1rem; background-color: #0d1b2a; color: #ffffff; border: 1px solid #415a77; border-radius: 6px; outline: none; margin-right: 10px; width: 250px; }
        select:focus { border-color: #60a5fa; }

        /* Rodapé */
        footer { background-color: #070e17; border-top: 1px solid #415a77; color: #94a3b8; text-align: center; padding: 25px; font-size: 0.85rem; margin-top: 40px; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='logo.jpg') }}" alt="Velocity Motors Logo">
                VELOCITY <span>MOTORS</span>
            </a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/veiculos">Veículos</a>
                <a href="/selecionar-marca">Filtrar Marca</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        &copy; 2026 Velocity Motors — Todos os direitos reservados.
    </footer>
</body>
</html>
